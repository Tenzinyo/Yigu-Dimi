backend:
  name: git-gateway
  branch: main

# Netlify Identity + Git Gateway means Decap commits to GitHub on your behalf
# using a token Netlify manages — you never touch a terminal or GitHub token.
publish_mode: simple
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

site_url: https://yigudimi.netlify.app
display_url: https://yigudimi.netlify.app
logo_url: /favicon.svg

collections:
  - name: "blog"
    label: "Blog"
    label_singular: "Blog post"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish date", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "list", default: [], required: false, hint: "e.g. travel, thoughts, tech" }
      - { label: "Short description (for previews & SEO)", name: "description", widget: "text", required: false }
      - { label: "Cover image", name: "cover", widget: "image", required: false, media_library: { config: { max_file_size: 5000000 } } }
      - { label: "Cover image alt text", name: "coverAlt", widget: "string", required: false, hint: "Required if you add a cover image — describe it for screen readers." }
      - { label: "Draft (hide from live site)", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "journal"
    label: "Journal"
    label_singular: "Journal entry"
    folder: "src/content/journal"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "list", default: [], required: false }
      - { label: "Mood (optional)", name: "mood", widget: "string", required: false, hint: "e.g. tired, hopeful, restless" }
      - { label: "Cover image", name: "cover", widget: "image", required: false }
      - { label: "Cover image alt text", name: "coverAlt", widget: "string", required: false }
      - { label: "Draft (hide from live site)", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "video"
    label: "Video"
    label_singular: "Video post"
    folder: "src/content/video"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish date", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "list", default: [], required: false }
      - { label: "Short description (for previews & SEO)", name: "description", widget: "text", required: false }
      - { label: "Video link (YouTube or Vimeo)", name: "videoUrl", widget: "string", hint: "Paste the normal watch/share link, e.g. https://www.youtube.com/watch?v=XXXXXXXXXXX" }
      - { label: "Thumbnail image (optional — used on cards if set)", name: "thumbnail", widget: "image", required: false }
      - { label: "Thumbnail alt text", name: "thumbnailAlt", widget: "string", required: false }
      - { label: "Draft (hide from live site)", name: "draft", widget: "boolean", default: false }
      - { label: "Notes (optional, shown below the video)", name: "body", widget: "markdown", required: false }

  - name: "art"
    label: "Art"
    label_singular: "Art piece"
    folder: "src/content/art"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "list", default: [], required: false }
      - { label: "Caption", name: "caption", widget: "text", required: false }
      - { label: "Image", name: "image", widget: "image", media_library: { config: { max_file_size: 8000000 } } }
      - { label: "Image alt text (required for accessibility)", name: "imageAlt", widget: "string", hint: "Describe what's in the image — read aloud by screen readers." }
      - { label: "Draft (hide from live site)", name: "draft", widget: "boolean", default: false }
      - { label: "Notes (optional)", name: "body", widget: "markdown", required: false }
